<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVERTIDOR Km-Mi</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>

<body>
    <div class="contenedor-formulario">
        <h1>CONVERTIDOR: Kilometros-Millas</h1>
        <p class="subtitulo">Calculadora de kilometros a millas</p>

        <form class="formulario" id="formulario-conversion" novalidate>
            <div class="grupo-formulario">
                <label for="kilometros">Kilometros:</label>
                <input type="number" id="kilometros" step="any" placeholder="Ingresa solo la cantidad, Ej: 24.8">
            </div>
            <p id="mensaje-error" class="mensaje-error"></p>    
            <button type="submit">Convertir</button>

        </form>


        <div class="cuadro-prueba">
            <h2>Formula:</h2>
            <p class="formula-texto"><code>M=K×0.621371</code></p>
        </div>

        <div class="resultados">
            <label for="resultado">Resultado:</label>
            <textarea id="resultado" readonly></textarea>
        </div>
    </div>

    <script src="js/ejercicio11.js"></script>
</body>
</html>
