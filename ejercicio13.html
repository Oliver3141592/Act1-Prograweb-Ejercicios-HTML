<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVERTIDOR Km-Mi</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
</head>

    

<body>
    <div class="contenedor-formulario">
        <h1>VERIFICADOR DE EDAD</h1>
        <p class="subtitulo">Verificador de mayoría de edad</p>
        
        <!--NOTA PROPIA:
        Un form agrupa campos que se envían juntos
        en el siguiente caso se probará fusionando los forms para resolver 
        el problema de actualización del ejercicio anterior al dar enter 
        cuando estamos en el campo "pesos", se puede decir que este ejercicio
        es más correcto que el anterior
        -->

        


       

        <form class="tasa-cambio" id="formulario-edad" novalidate>
            <div class="cuadro-prueba">
                <h2>Función:</h2>
                <p>El verificador evalúa mediante la edad ingresada si una persona ya puede votar</p>
            </div>

            <div class="formulario" id="formulario-conversion" novalidate>
                <br>
                <div class="grupo-formulario">
                    <label for="edad">Ingresa tu edad en años:</label>
                    <input type="number" id="edad" step="any" placeholder="Ingresa solo la cantidad, Ej: 15">
                </div>
                <p id="mensaje-error" class="mensaje-error"></p>    
                
            </div>
            <button type="submit">Verificar</button>
        </form>


        <div class="resultados">
            <label for="resultado">Resultado:</label>
            <textarea id="resultado" readonly></textarea>
        </div>
    </div>

    <script src="js/ejercicio13.js"></script>
</body>
</html>
