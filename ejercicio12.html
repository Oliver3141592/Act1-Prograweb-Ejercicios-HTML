<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVERTIDOR Km-Mi</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>

<body>
    <div class="contenedor-formulario">
        <h1>CONVERTIDOR:  Pesos (MXN) - Dolares (USA)</h1>
        <p class="subtitulo">Calculadora que convierte pesos mexicanos a su equivalencia en dolares estadounidenses</p>

        <div class="cuadro-prueba">
            <h2>Formula:</h2>
            <p class="formula-texto"><code>USD=MXN×tasa_de_cambio</code></p>
            <p>la tasa de cambio usada por defecto en este convertidor es 0.055, si desea cambiarla ingresela abajo</p>
        </div>

        <form class="formulario" id="formulario-conversion" novalidate>
            <br>
            <div class="grupo-formulario">
                <label for="pesos">Pesos (MXN):</label>
                <input type="number" id="pesos" step="any" placeholder="Ingresa solo la cantidad, Ej: 24.8">
            </div>
            

        </form>


       

        <form class="tasa-cambio" id="formulario-cambio" novalidate>
            <br>
            <div class="grupo-cambio">
                <label for="tasa-cambio">Tasa de Cambio (Opcional):</label>
                <input type="number" id="tasa-cambio" step="any" placeholder="Ej: 0.055 (por defecto)">
            </div>
            <p id="mensaje-error" class="mensaje-error"></p>    
            <button type="submit">Convertir</button>

        </form>


        <div class="resultados">
            <label for="resultado">Resultado:</label>
            <textarea id="resultado" readonly></textarea>
        </div>
    </div>

    <script src="js/ejercicio12.js"></script>
</body>
</html>
